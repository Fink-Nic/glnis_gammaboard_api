# Diagram-decomposed ttH@NLO integration campaign. GammaLoop's generated ttH NLO
# state contains 11 Integrands (NLO_GL00, NLO_GL02, ... , NLO_GL30) with a shared observable
# definition. Each child samples one group with its own MadNIS flow; the parent
# continuously adds their complex estimates and every compatible histogram bin.
#
# Requires a ttH state generated by the GammaLoop revision used to build
# GammaBoard. Override `state_folder` when it lives outside `resources/`.
# From the GammaBoard checkout:
# ./gammaboard run create ../glnis_gammaboard_api/examples/templates/runs/epem_a_ttxh_NLO_campaign.toml

kind = "integration_campaign"
name = "epem-a-ttxh-NLO-flow-campaign"
replacements = { state_folder = "../../gammaloop_os_ct/gammaboard_states/distributions_comparison/NLO/state_NLO_MSbar" , seed = 0 }
target = { kind = "vector", components = { real = -1.3205e-4, imag = 0.0 } }

[stop_condition]
max_total_samples = 10_000_000_000

[allocation]
min_samples_per_child = 30_000_000
allocation_window_samples = 10_000_000

[[children]]
name = "GL00"
replacements = { graph_group = 5, integrand_name = "NLO_MSbar", target_real = 3.1908e-05, seed = "$(seed:0)", state_folder = "$(state_folder:../../gammaloop/gammaboard_states/epem_a_ttxh/NLO/state)" }
run = { file = "gammaloop_train_sample.toml" }

