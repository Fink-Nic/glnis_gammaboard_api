# Standalone GammaLoop ttH integration; campaign bindings can select graph groups.
replacements = { 
    state_folder = "../../gammaloop_os_ct/gammaboard_states/distributions_comparison/NLO/state_NLO_MSbar",
    run_name = "epem_a_ttxh",
    integrand_name = "NLO_MSbar",
    graph_group = 10, 
    seed = 0, 
    target_real = -2.5040e-06,
    target_imag = 0.0,
    samples_for_update = 10_000,
    sample_samples = 100_000_000,
    train_steps = 2_000,
    train_batch_size = 10_000,
    # Must equal train_steps * train_batch_size
    train_samples = 20_000_000,
    cuda_id = 0,
    max_batch_size = 32_768,
    max_generation_size = 262_144,
    flow_layers = 4,
    flow_units = 1_000,
    rqs_bins = 10,
    rqs_bin_width = 3e-4,
    rqs_bin_height = 5e-4,
    rqs_bin_derivative = 1e-4,
}

name = 'madnis_NLO_GL02_sign_stratified'
target = { kind = "vector", components = { real = "$(target_real:-1.1848e-04)", imag = "$(target_imag:0.0)" } }

[evaluator]
kind = "gammaloop"
state_folder = "$(state_folder:../../gammaloop/gammaboard_states/epem_a_ttxh/NLO/state)"
integrand_name = "$(integrand_name:NLO_GL30)"
momentum_space = false
graph_groups = ["$(graph_group:0)"]

[evaluator.preprocessing]
read_only = true
commands = []

[[task_queue]]
name = "madnis-train"
kind = "sample"
estimator = "pooled"
publish_result = false
stop_condition = { max_samples = "$(train_samples:20_000_000)" }
accumulator = { config = "gammaloop" }

[task_queue.sampler.config]
kind = "process_sampler"
command = ["$resources/../../glnis_gammaboard_api/.venv/bin/glnis-gammaboard-sampler"]
cwd = "$resources/.."
# SampleBatch.training_remaining requests feedback only while training.

[task_queue.sampler.config.args]
seed = "$(seed:0)"
training_steps = "$(train_steps:2_000)"
training_batch_size = "$(train_batch_size:10_000)"
use_gpu = true
cuda_id = "$(cuda_id:0)"
save_path = 'integrations/madnis_checkpoints/madnis_NLO_GL02_stratified'

[task_queue.sampler.config.args.flow_config]
layers = "$(flow_layers:4)"
units = "$(flow_units:1_000)"
bins = "$(rqs_bins:10)"
min_bin_width = "$(rqs_bin_width:3e-4)"
min_bin_height = "$(rqs_bin_height:5e-4)"
min_bin_derivative = "$(rqs_bin_derivative:1e-4)"

[task_queue.queue_tuning]
max_batch_size = "$(max_batch_size:32_768)"
max_generation_size = "$(max_generation_size:262_144)"

[task_queue.sampler.config.stratification]
kind = "voronoi"
domain = { rectangular = { strata_dims = 1, discrete_cardinalities = [2], continuous_dims = 0 } }
centers = { "0" = [-1.0, 0.0], "1" = [1.0, 0.0] }
scales = [1.0, 0.001]

[[task_queue]]
name = "madnis-sample"
kind = "sample"
estimator = "stratified"
stop_condition = { max_samples = "$(sample_samples:1_000_000_000)" }
sampler = { from_name = "madnis-train" }
accumulator = { config = "gammaloop" }

[task_queue.queue_tuning]
max_batch_size = "$(max_batch_size:32_768)"
max_generation_size = "$(max_generation_size:262_144)"
