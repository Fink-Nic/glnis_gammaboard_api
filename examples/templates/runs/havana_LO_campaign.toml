# Diagram-decomposed ttH@LO integration campaign. GammaLoop's generated ttH LO
# state contains 2 Integrands (LO_GL0, LO_GL2) with a shared observable definition
#
# Requires a ttH state generated by the GammaLoop revision used to build
# GammaBoard. Override `state_folder` when it lives outside `resources/`.
# From the GammaBoard checkout:
# ./gammaboard run create ../glnis_gammaboard_api/examples/templates/runs/epem_a_ttxh_LO_campaign.toml

kind = "integration_campaign"
name = "epem-a-ttxh-LO-madnis-campaign"
replacements = { state_folder = "../../gammaloop_os_ct/gammaboard_states/distributions_comparison/LO/state" , seed = 0 }
target = { kind = "vector", components = { real = 1.56331e-03, imag = 0.0 } }

[stop_condition]
max_total_samples = 1_000_000_000

[allocation]
min_samples_per_child = 10_000_000
allocation_window_samples = 10_000_000

[[children]]
name = "GL0"
replacements = {
    integrand_name = "LO", graph_group = 1, target_real = 9.4622e-04, seed = "$(seed:0)", 
    state_folder = "$(state_folder:../../gammaloop_os_ct/gammaboard_states/distributions_comparison/LO/state)",
    samples_for_update = 10_000, train_samples = 10_000_000, sample_samples = 1_000_000_000,
}
run = { file = "havana_gammaloop_train_sample.toml" }

[[children]]
name = "GL2"
replacements = {
    integrand_name = "LO", graph_group = 0, target_real = 6.17234e-04, seed = "$(seed:0)", 
    state_folder = "$(state_folder:../../gammaloop_os_ct/gammaboard_states/distributions_comparison/LO/state)",
    samples_for_update = 10_000, train_samples = 10_000_000, sample_samples = 1_000_000_000,
}
run = { file = "havana_gammaloop_train_sample.toml" }
