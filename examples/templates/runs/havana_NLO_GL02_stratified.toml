# Standalone GammaLoop ttH integration; campaign bindings can select graph groups.
replacements = { 
    state_folder = "../../gammaloop_os_ct/gammaboard_states/distributions_comparison/NLO/state_NLO_MSbar",
    run_name = "epem_a_ttxh",
    integrand_name = "NLO_MSbar",
    graph_group = 10, 
    seed = 0, 
    target_real = -2.5040e-06,
    target_imag = 0.0,
    samples_for_update = 10_000,
    train_samples = 20_000_000,
    sample_samples = 100_000_000,
    bins = 200,
}

name = 'havana_NLO_GL02_sign_stratified'
target = { kind = "vector", components = { real = "$(target_real:-1.1848e-04)", imag = "$(target_imag:0.0)" } }

[evaluator]
kind = "gammaloop"
state_folder = "$(state_folder:../../gammaloop/gammaboard_states/epem_a_ttxh/NLO/state)"
integrand_name = "$(integrand_name:NLO_GL30)"
momentum_space = false
graph_groups = ["$(graph_group:0)"]

[evaluator.preprocessing]
read_only = true
commands = []

[[task_queue]]
name = "train"
kind = "sample"
estimator = "pooled"
publish_result = false
stop_condition = { max_samples = "$(train_samples:20_000_000)" }
accumulator = { config = "gammaloop" }
[task_queue.sampler.config]
kind = "havana_training" 
seed = "$(seed:11)" 
bins = "$(bins:200)" 
samples_for_update = "$(samples_for_update:10_000)" 
initial_training_rate = 0.05 
final_training_rate = 0.005

[task_queue.sampler.config.stratification]
kind = "voronoi"
domain = { rectangular = { strata_dims = 1, discrete_cardinalities = [2], continuous_dims = 0 } }
centers = { "0" = [-1.0, 0.0], "1" = [1.0, 0.0] }
scales = [1.0, 0.001]

[[task_queue]]
name = "inference"
kind = "sample"
estimator = "stratified"
stop_condition = { max_samples = "$(sample_samples:100_000_000)" }
accumulator = { config = "gammaloop" }
sampler = { config = { kind = "havana_inference", seed = "$(seed:11)" } }
