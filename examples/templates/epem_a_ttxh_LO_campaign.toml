# Diagram-decomposed ttH@LO integration campaign. GammaLoop's generated ttH NLO
# state contains 2 Integrands (LO_GL0, LO_GL2) with a shared observable definition
#
# Requires a ttH state generated by the GammaLoop revision used to build
# GammaBoard. Override `state_folder` when it lives outside `resources/`.
# Run: ./gammaboard run create resources/templates/runs/integration-campaign-qft-like.toml

kind = "integration_campaign"
name = "epem-a-ttxh-LO-madnis-campaign"
replacements = { state_folder = "../../gammaloop/gammaboard_states/epem_a_ttxh/LO/state" , seed = 0 }
target = { kind = "vector", components = { real = 1.56331e-03, imag = 0.0 } }

[stop_condition]
max_total_samples = 10_000_000_000

[allocation]
min_samples_per_child = 10_000_000
allocation_window_samples = 10_000_000

[[children]]
name = "GL0"
replacements = { 
    integrand_name = "LO_GL0", target_real = 9.4622e-04, seed = "$(seed:0)", state_folder = "$(state_folder:../../gammaloop/gammaboard_states/epem_a_ttxh/LO/state)", 
    train_steps = 1000, train_batch_size = 10_000, train_samples = 10_000_000, 
    cuda_id = 1, flow_layers = 3, flow_units = 600,
}
run = { file = "madnis_gammaloop_train_sample.toml" }

[[children]]
name = "GL2"
replacements = { 
    integrand_name = "LO_GL2", target_real = 6.17234e-04, seed = "$(seed:0)", state_folder = "$(state_folder:../../gammaloop/gammaboard_states/epem_a_ttxh/LO/state)",
    train_steps = 1000, train_batch_size = 10_000, train_samples = 10_000_000, 
    cuda_id = 1, flow_layers = 3, flow_units = 600,
}
run = { file = "madnis_gammaloop_train_sample.toml" }
