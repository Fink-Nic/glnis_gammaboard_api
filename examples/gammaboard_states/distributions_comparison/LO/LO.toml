type_description = "AL,LO"
quantity = "higgs_energy"
phase = "real"
x_min = 0.0
x_max = 500.0
n_bins = 100

[observables.higgs_log_energy]
title = "H log E"
type_description = "AL,LO"
quantity = "higgs_energy"
value_transform = "log10"
phase = "real"
x_min = 0.0
x_max = 5.0
n_bins = 100

[observables.higgs_pt]
