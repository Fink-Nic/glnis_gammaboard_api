# Inclusive photon-only LO LU validation card; never generates or integrates NLO.
# Physical gluon PDG 21 is included by explicit user-approved correction.
# Source reference observables are bin-integrated weights in pb.
[cli_settings.state]
folder = "./gammaboard_states/distributions_comparison/LO/state"

[default_runtime_settings.kinematics]
e_cm = 1000.0
[default_runtime_settings.kinematics.externals]
type = "constant"
[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0, 0.0, 0.0, 500.0], [500.0, 0.0, 0.0, -500.0]]
helicities = ["summed_averaged", "summed_averaged"]

[default_runtime_settings.general]
evaluator_method = "SummedFunctionMap"
enable_cache = false
debug_cache = false
generate_events = false
store_additional_weights_in_event = false
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188

[default_runtime_settings.integrator.observables_output]
format = ["hwu", "json"]

[cli_settings.global.generation.evaluator]
iterative_orientation_optimization = false
store_atom = false
compile = true
summed = false
summed_function_map = true

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true

[default_runtime_settings.subtraction]
disable_threshold_subtraction = true

[cli_settings.global.generation.compile]
compilation_mode = "assembly"
optimization_level = "O3"
fast_math = true
unsafe_math = true
custom = []

[cli_settings.global.n_cores]
feyngen = 6
generate = 6
compile = 6
integrate = 6

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = false

[[command_blocks]]
name = "generate"
commands = [
'''import model sm-default.json''',
'''run set_model_parameters''',
'''set global kv global.n_cores.feyngen=6''',
'''remove processes''',
'''generate xs e+ e- > t t~ h | e+ e- g t t~ h ghG ghG~ a QCD^2==0 QED^2==6 [{{2}} QCD=0]
      --numerator-grouping group_identical_graphs_up_to_scalar_rescaling
      --symmetrize-left-right-states true
      -p epem_a_tth -i LO''',
'''save dot''',
'''save state -o''',
]

[[command_blocks]]
name = "set_model_parameters"
commands = [
'''set model MT=173.0''',
'''set model WT=0.0''',
'''set model ymt=173.0''',
'''set model aS=0.118''',
'''set model aEWM1=132.507''',
'''set model Gf=1.166390e-05''',
'''set model MZ=91.188''',
'''set model MH=125.0''',
]

[[command_blocks]]
name = "set_differential_quantities"
commands = [
'''set process -p epem_a_tth -i LO string '

[quantities.integral]
type = "integral"

[quantities.jet_pt]
type = "jet"
computation = "scalar"
quantity = "PT"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_energy]
type = "jet"
computation = "scalar"
quantity = "E"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_y]
type = "jet"
computation = "scalar"
quantity = "y"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_eta]
type = "jet"
computation = "scalar"
quantity = "eta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_cos_theta]
type = "jet"
computation = "scalar"
quantity = "CosTheta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_count]
type = "jet"
computation = "count"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.top_energy]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "E"
ordering = "Quantity"
order = "Descending"

[quantities.higgs_energy]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "E"

[quantities.top_pt]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "PT"

[quantities.higgs_pt]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "PT"

[quantities.top_y]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "y"

[quantities.higgs_y]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "y"

[quantities.top_eta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "eta"

[quantities.higgs_eta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "eta"

[quantities.top_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "CosTheta"

[quantities.higgs_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "CosTheta"
'''',
]

[[command_blocks]]
