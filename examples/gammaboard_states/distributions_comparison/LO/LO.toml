phase = "real"
kind = "discrete"
domain = { type = "explicit_range", min = 0, max = 1 }

'''',
]

[[command_blocks]]
name = "configure_integrate"
commands = [
'''run set_model_parameters''',
'''run set_differential_quantities''',
'''run set_differential_observables''',
'''set process -p epem_a_tth -i LO string '
[general]
evaluator_method = "SingleParametric"
[sampling]
graphs = "monte_carlo"
orientations = "monte_carlo"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
' ''',
'''set process -p epem_a_tth -i LO kv integrator.n_increase=0 integrator.n_start=100000 integrator.n_max=1000000 integrator.seed=1337''',
]

[[command_blocks]]
name = "integrate"
commands = [
'''run configure_integrate''',
'''integrate -p epem_a_tth -i LO --n-cores 6 --workspace-path ./integration_workspace --renderer tabled --batch-size 10000 --show-phase real --write-results-for-each-iteration''',
]

[[command_blocks]]
name = "configure_integrate_summed"
commands = [
'''run configure_integrate''',
'''set process -p epem_a_tth -i LO string '
[sampling]
graphs = "summed"
orientations = "summed"
sampling_multichanneling = true
sampling_channels = "summed"
default_channel_selection = ["auto:optimized_lmb"]
' ''',
]
