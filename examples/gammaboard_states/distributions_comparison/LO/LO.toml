'''set process -p epem_a_tth -i LO string '

[observables.integral]
title = "xs"
type_description = "AL,LO"
quantity = "integral"
phase = "real"
kind = "discrete"
domain = { type = "single_bin" }
labels = { type = "custom", labels = ["total integral"] }

# Higgs observables

[observables.higgs_energy]
