# Inclusive photon-only NLO correction: fully-MSbar prescription (including top mass).
# Complete generated graph set, including self-energies and raised cuts.
# This is a separate calculation from the mixed OS-mass MadGraph benchmark.
[cli_settings.state]
folder = "./gammaboard_states/distributions_comparison/NLO/state_NLO_MSbar"
[cli_settings.global.n_cores]
feyngen = 6
generate = 2
compile = 2
integrate = 6
[cli_settings.global.generation]
explicit_orientation_sum_only = false
[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = true
summed = false
summed_function_map = true
[cli_settings.global.generation.compile]
compilation_mode = "assembly"
optimization_level = "O3"
fast_math = true
unsafe_math = true
custom = []
[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true
disable_integrated_ct = false
[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = true
[cli_settings.global.generation.uv]
softct = false
inner_products = true
generate_integrated = true
subtract_uv = true
final_integrand = "ThreeD"
local_uv_cts_from_expanded_4d_integrands = false
orchestrator = "hedge_poset"
[cli_settings.global.generation.uv.renormalization_prescription]
log_divergent = "MUV"
massive_power_divergent = "MUV"
massless_power_divergent = "MUV"
overrides = []
[cli_settings.global.generation.uv.vakint]
normalization = "MSbar"
additional_normalization = "1"
form_exe_path = "form"
[default_runtime_settings.kinematics]
e_cm = 1000.0
[default_runtime_settings.kinematics.externals]
type = "constant"
[default_runtime_settings.kinematics.externals.data]
momenta = [[500.0,0.0,0.0,500.0],[500.0,0.0,0.0,-500.0]]
helicities = ["summed_averaged","summed_averaged"]
[default_runtime_settings.general]
evaluator_method = "SingleParametric"
enable_cache = false
debug_cache = false
generate_events = false
store_additional_weights_in_event = false
integral_unit = "picobarn"
mu_r = 91.188
m_uv = 91.188
[default_runtime_settings.integrator]
n_start = 500
n_increase = 0
n_max = 500
seed = 1337
integrated_phase = "real"
[default_runtime_settings.integrator.observables_output]
format = ["hwu","json"]
[default_runtime_settings.sampling]
graphs = "monte_carlo"
graph_names = []
orientations = "summed"
sampling_multichanneling = true
sampling_channels = "monte_carlo"
sampling_channel_weight = "ose"
default_channel_selection = ["auto:optimized_lmb"]
[default_runtime_settings.subtraction]
esurface_existence_threshold = 1.0e-7
disable_threshold_subtraction = false
[[default_runtime_settings.stability.rotation_axis]]
type = "z"
[[default_runtime_settings.stability.rotation_axis]]
type = "x"
[[default_runtime_settings.stability.rotation_axis]]
type = "y"
[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 1.0e-5
required_precision_for_im = 1.0e-5
escalate_for_large_weight_threshold = 0.99
[[default_runtime_settings.stability.levels]]
precision = "Quad"
required_precision_for_re = 1.0e-8
required_precision_for_im = 1.0e-8
escalate_for_large_weight_threshold = -1.0

[[command_blocks]]
name = "set_model_parameters_NLO_MSbar"
commands = [
'''set model MT=173.0''',
'''set model WT=0.0''',
'''set model ymt=173.0''',
'''set model aS=0.118''',
'''set model aEWM1=132.507''',
'''set model Gf=1.166390e-05''',
'''set model MZ=91.188''',
'''set model MH=125.0''',
]

[[command_blocks]]
name = "generate_diagrams_NLO_MSbar"
commands = [
'''import model sm-default.json''',
'''run set_model_parameters_NLO_MSbar''',
'''remove processes''',
'''generate xs e+ e- > t t~ h | e+ e- g t t~ h ghG ghG~ a QCD^2==2 QED^2==6 [{{3}} QCD=1]
--numerator-grouping group_identical_graphs_up_to_scalar_rescaling
--symmetrize-left-right-states true
-p epem_a_tth -i NLO_MSbar --only-diagrams''',
'''save dot''',
'''save state -o''',
]

[[command_blocks]]
name = "generate_integrands_NLO_MSbar"
commands = [
'''generate existing -p epem_a_tth -i NLO_MSbar''',
'''save state -o''',
]

[[command_blocks]]
name = "set_differential_quantities_NLO_MSbar"
commands = [
'''set process -p epem_a_tth -i NLO_MSbar string '

[quantities.integral]
type = "integral"

[quantities.jet_pt]
type = "jet"
computation = "scalar"
quantity = "PT"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_energy]
type = "jet"
computation = "scalar"
quantity = "E"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_y]
type = "jet"
computation = "scalar"
quantity = "y"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_eta]
type = "jet"
computation = "scalar"
quantity = "eta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_cos_theta]
type = "jet"
computation = "scalar"
quantity = "CosTheta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_count]
type = "jet"
computation = "count"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 21, 82]
ordering = "PT"
order = "Descending"

[quantities.top_energy]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "E"
ordering = "Quantity"
order = "Descending"

[quantities.higgs_energy]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "E"

[quantities.top_pt]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "PT"

[quantities.higgs_pt]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "PT"

[quantities.top_y]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "y"

[quantities.higgs_y]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "y"

[quantities.top_eta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "eta"

[quantities.higgs_eta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "eta"

[quantities.top_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "CosTheta"

[quantities.higgs_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "CosTheta"
'''',
]

[[command_blocks]]
name = "set_differential_observables_NLO_MSbar"
commands = [
'''set process -p epem_a_tth -i NLO_MSbar string '

[observables.integral]
title = "xs"
type_description = "AL,NLO_MSbar"
quantity = "integral"
phase = "real"
kind = "discrete"
domain = { type = "single_bin" }
labels = { type = "custom", labels = ["total integral"] }

# Higgs observables

[observables.higgs_energy]
title = "H E"
type_description = "AL,NLO_MSbar"
quantity = "higgs_energy"
phase = "real"
x_min = 0.0
x_max = 500.0
n_bins = 100

[observables.higgs_log_energy]
title = "H log E"
type_description = "AL,NLO_MSbar"
quantity = "higgs_energy"
value_transform = "log10"
phase = "real"
x_min = 0.0
x_max = 5.0
n_bins = 100

[observables.higgs_pt]
title = "H pt"
type_description = "AL,NLO_MSbar"
quantity = "higgs_pt"
phase = "real"
x_min = 0.0
x_max = 500.0
n_bins = 100

[observables.higgs_log_pt]
