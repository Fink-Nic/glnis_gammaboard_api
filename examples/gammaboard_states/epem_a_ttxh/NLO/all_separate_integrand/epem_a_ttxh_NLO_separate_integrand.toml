[cli_settings]
[cli_settings.state]
folder = "./gammaboard_states/epem_a_ttxh/NLO/all_separate_integrand/state"

[[command_blocks]]
name = "generate_diagrams"
# Mapping of the 11 NLO diagrams w.r.t our notation in https://arxiv.org/pdf/2203.11038
# Targets from the real part of the cross-section in the OS+MSbar scheme
# (table 7 of https://arxiv.org/pdf/2203.11038 and model parameters defined therein)
# GL00 -> F.2 ->  +3.1908e-05
# GL02 -> F.1 ->  -2.504e-06
# GL06 -> F.8 ->  -2.4706e-04
# GL08 -> F.5 ->  -3.2336e-06
# GL10 -> F.9 ->  +4.7475e-05
# GL12 -> F.6 ->  +5.5828e-05
# GL18 -> F.3 ->  +1.3472e-04
# GL20 -> F.10 -> +2.0875e-04
# GL22 -> F.11 -> -9.1283e-05
# GL26 -> F.4 ->  -1.47653e-04
# GL30 -> F.7 ->  -1.18480e-04
# total -> MG5aMC -> -1.3205e-4
commands = [
  "import model sm-default.json",
  "set global kv global.n_cores.feyngen=10",
  "remove processes",
  """generate xs e+ e- > t t~ h | e+ e- g t t~ h ghG ghG~ a QCD^2==2 QED^2==6 [{{3}} QCD=1]
      --numerator-grouping group_identical_graphs_up_to_scalar_rescaling
      --symmetrize-left-right-states true
      -p epem_a_ttxh -i NLO
      --only-diagrams""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL00
      --with-graph-names GL00""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL02
      --with-graph-names GL02""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL06
      --with-graph-names GL06""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL08
      --with-graph-names GL08""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL10
      --with-graph-names GL10""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL12
      --with-graph-names GL12""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL18
      --with-graph-names GL18""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL20
      --with-graph-names GL20""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL22
      --with-graph-names GL22""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL26
      --with-graph-names GL26""",
  """select -p epem_a_ttxh -i NLO 
      --output_process epem_a_ttxh --output_integrand NLO_GL30
      --with-graph-names GL30""",
  "remove processes -p epem_a_ttxh -i NLO",
  "save dot",
]

[[command_blocks]]
name = "generate_integrands"
commands = [
    "generate existing",
    "run set_model_parameters",
    "run set_differential_quantities",
    "run set_differential_observables",
    "set process -p epem_a_ttxh -i NLO_GL30 kv general.m_uv=10.0",
    "save state -o"
]

[[command_blocks]]
name = "set_model_parameters"
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[command_blocks]]
name = "integrate"
commands = [
  "run set_model_parameters",
  """
  set process -p epem_a_ttxh -i "$(integrand_name:NLO_GL00)" kv
    integrator.n_increase=100000
    integrator.n_start=100000
    integrator.n_max=10000000000
    integrator.seed=1337
    integrator.integrated_phase="real"
    integrator.continuous_dim_learning_rate=0.4
  """,
  """
  integrate -p epem_a_ttxh -i "$(integrand_name:NLO_GL00)" --n-cores 10
         --target epem_a_ttxh@"$(integrand_name:NLO_GL00)"="$(integration_target:+3.1908e-05)",0.0
				 --renderer ratatui
				 --batch-size 10000
				 --show-phase both
				 --show-max-weight-info
				 --show-top-discrete-grid
				 --show-discrete-contributions-sum
				 --write-results-for-each-iteration
         --restart
  """
]

[[command_blocks]]
name = "integrate_all"
commands = [
  "run set_model_parameters",
  """
  integrate 
         -p epem_a_ttxh -i NLO_GL00
         -p epem_a_ttxh -i NLO_GL02
         -p epem_a_ttxh -i NLO_GL06
         -p epem_a_ttxh -i NLO_GL08
         -p epem_a_ttxh -i NLO_GL10
         -p epem_a_ttxh -i NLO_GL12
         -p epem_a_ttxh -i NLO_GL18
         -p epem_a_ttxh -i NLO_GL20
         -p epem_a_ttxh -i NLO_GL22
         -p epem_a_ttxh -i NLO_GL26
         -p epem_a_ttxh -i NLO_GL30
         --target epem_a_ttxh@NLO_GL00=+3.1908e-05,0.0
         --target epem_a_ttxh@NLO_GL02=-2.504e-06,0.0
         --target epem_a_ttxh@NLO_GL06=-2.4706e-04,0.0
         --target epem_a_ttxh@NLO_GL08=-3.2336e-06,0.0
         --target epem_a_ttxh@NLO_GL10=+4.7475e-05,0.0
         --target epem_a_ttxh@NLO_GL12=+5.5828e-05,0.0
         --target epem_a_ttxh@NLO_GL18=+1.3472e-04,0.0
         --target epem_a_ttxh@NLO_GL20=+2.0875e-04,0.0
         --target epem_a_ttxh@NLO_GL22=-9.1283e-05,0.0
         --target epem_a_ttxh@NLO_GL26=-1.47653e-04,0.0
         --target epem_a_ttxh@NLO_GL30=-1.18480e-04,0.0
         --n-cores 30
				 --renderer ratatui
				 --batch-size 10000
				 --show-phase both
				 --show-max-weight-info
				 --show-top-discrete-grid
				 --write-results-for-each-iteration
                 --uncorrelated
         --restart
  """,
]


[default_runtime_settings.kinematics]
e_cm = 1000.0

[default_runtime_settings.kinematics.externals]
type = "constant"

[default_runtime_settings.kinematics.externals.data]
momenta = [
   	[
    	 500.0,
    	 0.0,
    	 0.0,
    	 500.0,
	],
   	[
    	 500.0,
    	 0.0,
    	 0.0,
    	-500.0,
	],
]
helicities = [
    "summed_averaged",
	"summed_averaged",
]

[default_runtime_settings.general]
evaluator_method = "SummedFunctionMap"
enable_cache = false
debug_cache = false
generate_events = false
store_additional_weights_in_event = false
integral_unit = "picobarn"
m_uv = 91.188
mu_r = 91.188

[default_runtime_settings.integrator]
n_increase=100000
n_start=100000
n_max=10000000000
seed=1337
integrated_phase="real"
continuous_dim_learning_rate=0.4

[cli_settings.global.generation.evaluator]
do_algebra = false
iterative_orientation_optimization = false
store_atom = true
compile = true
summed = false
summed_function_map = true
horner_iterations = 5
cpe_iterations = 10

[cli_settings.global.generation.compile]
compilation_mode = "symjit"
optimization_level = "O3"
fast_math = true
unsafe_math = true
custom = []

[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
# The option below specifies the generation of threshold for the kinematics supplied
check_esurface_at_generation = true
esurface_existence_threshold = 1.0e-7
skip_thresholds_that_are_cuts = true

[default_runtime_settings.subtraction]
esurface_existence_threshold = 1.0e-7
disable_threshold_subtraction = false

[default_runtime_settings.sampling]
graphs = "monte_carlo"
orientations = "summed"
lmb_multichanneling = true
lmb_channel_weight = "ose"
# For importance-sampling over channels, use the quantity below
lmb_channels = "monte_carlo"

[default_runtime_settings.integrator.observables_output]
format = ["hwu","json"]

[cli_settings.global.generation.uv]
softct=false
inner_products=true
generate_integrated=true
subtract_uv=true

[cli_settings.global.n_cores]
feyngen = 10
generate = 10
compile = 10
integrate = 10

[cli_settings.global.generation.tropical_subgraph_table]
panic_on_fail = true
disable_tropical_generation = true

[[default_runtime_settings.stability.rotation_axis]]
type = "z"

[[default_runtime_settings.stability.levels]]
precision = "Double"
required_precision_for_re = 1e-7
required_precision_for_im = 1e-7
escalate_for_large_weight_threshold = 0.9

[[default_runtime_settings.stability.levels]]
precision = "Quad"
required_precision_for_re = 1e-5
required_precision_for_im = 1e-5
escalate_for_large_weight_threshold = -1.0

[[default_runtime_settings.stability.levels]]
precision = "Arb"
required_precision_for_re = 1e-5
required_precision_for_im = 1e-5
escalate_for_large_weight_threshold = -1.0

[[command_blocks]]
name = "set_differential_quantities"
commands = [
    "run -D integrand_name=NLO_GL00 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL02 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL06 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL08 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL10 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL12 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL18 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL20 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL22 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL26 set_differential_quantities_single",
    "run -D integrand_name=NLO_GL30 set_differential_quantities_single",
]

[[command_blocks]]
name = "set_differential_observables"
commands = [
    "run -D integrand_name=NLO_GL00 set_differential_observables_single",
    "run -D integrand_name=NLO_GL02 set_differential_observables_single",
    "run -D integrand_name=NLO_GL06 set_differential_observables_single",
    "run -D integrand_name=NLO_GL08 set_differential_observables_single",
    "run -D integrand_name=NLO_GL10 set_differential_observables_single",
    "run -D integrand_name=NLO_GL12 set_differential_observables_single",
    "run -D integrand_name=NLO_GL18 set_differential_observables_single",
    "run -D integrand_name=NLO_GL20 set_differential_observables_single",
    "run -D integrand_name=NLO_GL22 set_differential_observables_single",
    "run -D integrand_name=NLO_GL26 set_differential_observables_single",
    "run -D integrand_name=NLO_GL30 set_differential_observables_single",
]

[[command_blocks]]
name = "set_differential_quantities_single"
commands = [
  """set process -p epem_a_ttxh -i "$(integrand_name:NLO_GL00)" string '

[quantities.integral]
type = "integral"

[quantities.jet_pt]
type = "jet"
computation = "scalar"
quantity = "PT"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_energy]
type = "jet"
computation = "scalar"
quantity = "E"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_y]
type = "jet"
computation = "scalar"
quantity = "y"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_eta]
type = "jet"
computation = "scalar"
quantity = "eta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_cos_theta]
type = "jet"
computation = "scalar"
quantity = "CosTheta"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.jet_count]
type = "jet"
computation = "count"
algorithm = "anti_kt"
dR = 0.4
min_jpt = 20.0
clustered_pdgs = [-82, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 82]
ordering = "PT"
order = "Descending"

[quantities.top_energy]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "E"
ordering = "Quantity"
order = "Descending"

[quantities.higgs_energy]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "E"

[quantities.top_pt]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "PT"

[quantities.higgs_pt]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "PT"

[quantities.top_y]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "y"

[quantities.higgs_y]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "y"

[quantities.top_eta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "eta"

[quantities.higgs_eta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "eta"

[quantities.top_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [-6,6]
quantity = "CosTheta"

[quantities.higgs_cos_theta]
type = "particle"
computation = "scalar"
pdgs = [25,]
quantity = "CosTheta"
'""",
]

[[command_blocks]]
name = "set_differential_observables_single"
commands = [
  """set process -p epem_a_ttxh -i "$(integrand_name:NLO_GL00)" string '

[observables.integral]
