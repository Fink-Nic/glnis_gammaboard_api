# Diagram-decomposed ttH@LO integration campaign. GammaLoop's generated ttH NLO
# state contains 11 Integrands (NLO_GL00, NLO_GL02, ... , NLO_GL30) with a shared observable
# definition. Each child samples one group with its own Havana grid; the parent
# continuously adds their complex estimates and every compatible histogram bin.
#
# Requires a ttH state generated by the GammaLoop revision used to build
# GammaBoard. Override `state_folder` when it lives outside `resources/`.
# Run: ./gammaboard run create resources/templates/runs/integration-campaign-qft-like.toml

kind = "integration_campaign"
name = "epem-a-ttxh-NLO-madnis-campaign"
replacements = { state_folder = "../..gammaloop/gammaboard_states/epem_a_ttxh/NLO/all_separate_integrand/state" }
# target = { kind = "vector", components = { real = -1.3205e-4 , imag = 0.0 } }

[stop_condition]
max_total_samples = 10_000_000_000

[allocation]
min_samples_per_child = 50_000_000
allocation_window_samples = 10_000_000

[[children]]
name = "GL00"
replacements = { integrand_name = "NLO_GL00", target_real = 3.1908e-05, seed = 0, state_folder = "$(state_folder:../..gammaloop/gammaboard_states/epem_a_ttxh/NLO/all_separate_integrand/state)" }
run = { file = "epem_a_ttxh_NLO_single.toml" }

