[sampler]
kind = "madnis"
seed = 42
training_steps = 10
training_batch_size = 128
max_batch_size = 64
use_gpu = false

[sampler.flow_config]
layers = 2
units = 16
bins = 4

[integrand]
kind = "sine"
continuous_dims = 2
omega = 2
offset = 2.0

[aggregator]
mode = "train_then_infer"
inference_samples = 2048
evaluation_workers = 2
evaluation_batch_size = 32
max_in_flight_batches = 4
log_every = 10
