# Each named entry overrides the shared sampler table, recursively.
# Runs are independent and execute sequentially in the order below.
[comparison]
run_name = "ghostbumps_flows"
output_dir = "../../outputs/sampler_comparison"
comment = "Compare two flow sizes on the same integrand and seed."
save_data = true
plot = true

[comparison.plotting]
dpi = 150
figsize = [10, 8]

[integrand]
kind = "ghostbumps"
centers = [[0.75, 0.75], [0.25, 0.25]]
sigma = 0.15

[integrand.target]
real_mean = 0.2565

[aggregator]
mode = "train_then_infer"
inference_samples = 100000
training_phase = "real"
evaluation_workers = 2
evaluation_batch_size = 32
max_in_flight_batches = 4
log_every = 10

[sampler]
seed = 42
training_steps = 100
training_batch_size = 256
max_batch_size = 64
use_gpu = false

[sampler.flow_config]
layers = 2
units = 16
bins = 4

[[samplers]]
name = "small-flow"

[[samplers]]
name = "large-flow"

[samplers.flow_config]
layers = 4
units = 128
