[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "glnis_gammaboard_api"
version = "0.1.1"
requires-python = ">=3.13, <3.14"
authors = [ { name = "Nic Fink", email = "nic.fink@students.unibe.ch" } ]

dependencies = [
    "pytest",
    "numpy>=2.2,<3",
    "torch>=2.6,<3",
    "vegas>=6.2",
    "pydot>=3.0",
    "matplotlib>=3.6",
    "symbolica==3.0.0",
    "gammaboard-process @ git+https://github.com/alphal00p/gammaboard.git@main#subdirectory=process_api/python",
    "madnis @ git+https://github.com/madgraph-ml/madnis.git@main",
]

[project.scripts]
glnis-gammaboard-sampler = "run_sampler:main"
glnis-integrate = "glnis.scripts.run:main"
glnis-compare-samplers = "glnis.scripts.sampler_comparison:main"
glnis-slice-plot = "glnis.scripts.slice_plots:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "glnis._rust"
bindings = "pyo3"
locked = true
editable-profile = "dev"
# Build isolation uses temporary venv paths; keep PyO3's interpreter stable so
# reinstalling the editable package does not invalidate native dependencies.
use-base-python = true
include = [
    { path = "src/glnis_runtime_bootstrap.py", format = "wheel" },
    { path = "src/madnis_sampler.py", format = "wheel" },
    { path = "src/run_sampler.py", format = "wheel" },
]
