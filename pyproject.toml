[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glnis_gammaboard_api"
version = "0.1.1"
requires-python = ">=3.13, <3.14"
authors = [ { name = "Nic Fink", email = "nic.fink@students.unibe.ch" } ]

dependencies = [
    "numpy>=2.2,<3",
    "torch>=2.6,<3",
    "vegas>=6.2",
    "matplotlib>=3.6",
    "gammaboard-process @ git+https://github.com/alphal00p/gammaboard.git@c5968d1d9ade1d8c827f68e4cb7055937298946e#subdirectory=process_api/python",
    "madnis @ git+https://github.com/madgraph-ml/madnis.git@main",
]

[project.optional-dependencies]
gammaloop = [
    "glnis-gammaloop-native==0.1.1",
    "symbolica==3.0.0",
    "pydot>=3.0",
]
test = ["pytest", "setuptools>=77"]

[project.scripts]
glnis-gammaboard-sampler = "run_sampler:main"
glnis-integrate = "glnis.scripts.run:main"
glnis-compare-samplers = "glnis.scripts.sampler_comparison:main"
glnis-slice-plot = "glnis.scripts.slice_plots:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false
py-modules = [
    "glnis_runtime_bootstrap",
    "madnis_sampler",
    "run_sampler",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["glnis", "glnis.*"]
# glnis.core.nn is an implicit namespace package.
namespaces = true
